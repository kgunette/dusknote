<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12151d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%APP_NAME%" />

    <!-- The security policy, carried inside the page so it travels to ANY host.
         vercel.json sends the same policy as a real header, which is stronger, but headers are
         host-specific: fork this and deploy to Netlify, Cloudflare Pages, or S3 and you would
         silently get no policy at all, while the app appeared to work perfectly. That matters
         because the Google access token lives in localStorage and script-src is what stops
         injected code reading it.
         frame-ancestors is deliberately absent: it is ignored in a meta tag and must be a real
         header. X-Frame-Options in vercel.json covers it there; a non-Vercel host has to set it
         themselves, which the setup guide says. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://sheets.googleapis.com https://www.googleapis.com https://api.github.com; form-action 'self'"
    />

    <!-- Every deployment of this app is one person's private health record. Search engines have
         no business indexing it: a URL named after its owner would put the existence of someone's
         tracker into search results. Three layers, because each has a gap: robots.txt is honoured
         voluntarily, this meta tag requires the crawler to actually read the page, and
         X-Robots-Tag in vercel.json arrives with the response before the page does. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- The link-preview card, the same one the product page carries, so a shared link to any
         copy (the demo included) shows the mark and the tagline instead of a bare title. The
         picture is served from the product page, so no copy has to carry it, and nothing here
         says anything about whose copy it is. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%APP_NAME%" />
    <meta property="og:description" content="A free forever, open-source tracker for any ongoing health condition. Entries live on your device, back up to a Google Sheet in your own Drive, and export as a report you can share with anyone you choose." />
    <meta property="og:image" content="https://dusknote.app/img/preview.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="Dusknote: your health notes, on your phone, yours forever. A phone showing the Stats screen." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>%APP_NAME%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
